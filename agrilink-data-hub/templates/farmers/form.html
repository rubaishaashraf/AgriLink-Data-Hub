{% extends "base.html" %}
{% block title %}{{ action }} Farmer · AgriLink{% endblock %}
{% block content %}
<section class="page-header">
  <h2>{{ action }} Farmer</h2>
</section>

<section class="card">
  <form method="post">
    <div class="form-grid">
      <div>
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required value="{{ farmer.first_name if farmer else '' }}">
      </div>
      <div>
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required value="{{ farmer.last_name if farmer else '' }}">
      </div>
      <div>
        <label for="farm_name">Farm Name</label>
        <input type="text" id="farm_name" name="farm_name" required value="{{ farmer.farm_name if farmer else '' }}">
      </div>
      <div>
        <label for="location">Location</label>
        <input type="text" id="location" name="location" required value="{{ farmer.location if farmer else '' }}">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ farmer.email if farmer and farmer.email else '' }}">
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" value="{{ farmer.phone if farmer and farmer.phone else '' }}">
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">{{ action }} Farmer</button>
      <a href="{{ url_for('farmers.list_farmers') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
