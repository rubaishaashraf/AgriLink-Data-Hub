{% extends "base.html" %}
{% block title %}{{ action }} Fertilizer · AgriLink{% endblock %}
{% block content %}
<section class="page-header">
  <h2>{{ action }} Fertilizer</h2>
</section>

<section class="card">
  <form method="post">
    <div class="form-grid">
      <div>
        <label for="fertilizer_name">Fertilizer Name</label>
        <input type="text" id="fertilizer_name" name="fertilizer_name" required>
      </div>
      <div>
        <label for="fertilizer_type">Type</label>
        <select id="fertilizer_type" name="fertilizer_type" required>
          {% for type in ['Organic', 'Chemical', 'Mixed'] %}
          <option value="{{ type }}">{{ type }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="unit">Unit</label>
        <select id="unit" name="unit" required>
          {% for unit in ['kg', 'L', 'bag'] %}
          <option value="{{ unit }}">{{ unit }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="npk_ratio">NPK Ratio</label>
        <input type="text" id="npk_ratio" name="npk_ratio" placeholder="e.g. 14-14-14">
      </div>
      <div>
        <label for="quantity">Initial Stock</label>
        <input type="number" step="0.01" min="0" id="quantity" name="quantity" value="0">
      </div>
      <div>
        <label for="reorder_level">Reorder Level</label>
        <input type="number" step="0.01" min="0" id="reorder_level" name="reorder_level" value="10">
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">{{ action }} Fertilizer</button>
      <a href="{{ url_for('fertilizers.list_fertilizers') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
